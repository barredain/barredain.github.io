<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lector de diálogos tipo karaoke</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Panel de configuración */
    #setup {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 700px;
      width: 90%;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 250px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #1db954; }
    button {
      background: #1db954;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #1ed760; transform: scale(1.02); }
    button.secondary { background: #2a2a2a; color: #fff; }

    /* Vista tipo Spotify Lyrics */
    #reader {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(to bottom, #121212 70%, transparent);
      z-index: 10;
    }
    #status { font-size: 0.9rem; color: #1db954; font-weight: 600; }
    #lyrics-container {
      flex: 1;
      overflow-y: auto;
      padding: 35vh 10vw 50vh 10vw;
      scroll-behavior: smooth;
      line-height: 1.6;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
    }
    #lyrics-container::-webkit-scrollbar { display: none; }

    .word {
      display: inline-block;
      margin-right: 0.28em;
      opacity: 0.28;
      transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }
    .word:hover { opacity: 0.6; }
    .word.spoken {
      opacity: 1;
      color: #ffffff;
    }
    .word.current {
      opacity: 1;
      color: #1db954;
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <div id="setup">
    <h2>Pegá tu diálogo</h2>
    <textarea id="script-input" placeholder="Escribí o pegá acá el texto que vas a leer en voz alta..."></textarea>
    <button id="start-btn">Empezar lectura</button>
  </div>

  <div id="reader">
    <div id="top-bar">
      <span id="status">● Escuchando micrófono...</span>
      <button class="secondary" id="reset-btn">Editar texto</button>
    </div>
    <div id="lyrics-container"></div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const setupDiv = document.getElementById('setup');
    const readerDiv = document.getElementById('reader');
    const scriptInput = document.getElementById('script-input');
    const lyricsContainer = document.getElementById('lyrics-container');
    const statusText = document.getElementById('status');

    let wordsData = [];
    let currentIndex = 0;
    let recognition = null;
    let isReading = false;

    // Estado para evitar re-procesar palabras ya matcheadas en eventos interim
    let lastProcessedWordCount = 0;
    let accumulatedFinalTranscript = '';

    // Limpia tildes, mayúsculas y signos para comparar fonéticamente
    function normalize(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9ñ]/g, "");
    }

    function renderScript(text) {
      lyricsContainer.innerHTML = '';
      wordsData = [];
      currentIndex = 0;

      const rawWords = text.trim().split(/\s+/);
      rawWords.forEach((raw, idx) => {
        const span = document.createElement('span');
        span.textContent = raw;
        span.className = 'word';
        if (idx === 0) span.classList.add('current');

        // Permite hacer clic en cualquier palabra para saltar manualmente ahí
        span.addEventListener('click', () => advanceTo(idx));

        lyricsContainer.appendChild(span);
        wordsData.push({
          raw,
          clean: normalize(raw),
          el: span
        });
      });
    }

    function advanceTo(targetIndex) {
      if (targetIndex >= wordsData.length) targetIndex = wordsData.length - 1;

      for (let i = 0; i <= targetIndex; i++) {
        wordsData[i].el.classList.remove('current');
        wordsData[i].el.classList.add('spoken');
      }
      for (let i = targetIndex + 1; i < wordsData.length; i++) {
        wordsData[i].el.classList.remove('spoken', 'current');
      }

      currentIndex = targetIndex;
      if (wordsData[currentIndex]) {
        wordsData[currentIndex].el.classList.add('current');
        wordsData[currentIndex].el.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }

    function initSpeech() {
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usá Chrome o Edge.");
        return;
      }

      // Reiniciar estado de transcript al iniciar/reiniciar
      lastProcessedWordCount = 0;
      accumulatedFinalTranscript = '';

      recognition = new SpeechRecognition();
      recognition.lang = 'es-UY'; // Funciona también con es-ES o es-AR
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        // Separar resultados finales (confirmados) de los interim (tentativo)
        let newFinals = '';
        let interim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            newFinals += ' ' + event.results[i][0].transcript;
          } else {
            interim += ' ' + event.results[i][0].transcript;
          }
        }

        // Si hay finales nuevos, agregarlos al acumulado y actualizar el punto de corte
        if (newFinals.trim()) {
          accumulatedFinalTranscript += newFinals;
          lastProcessedWordCount = accumulatedFinalTranscript.trim().split(/\s+/).filter(Boolean).length;
        }

        // Transcript completo = finales confirmados + interim actual
        const fullTranscript = (accumulatedFinalTranscript + ' ' + interim).trim();
        const allWords = fullTranscript.split(/\s+/).map(normalize).filter(Boolean);

        // Solo procesar las palabras NUEVAS desde la última vez que procesamos
        const newWords = allWords.slice(lastProcessedWordCount);
        lastProcessedWordCount = allWords.length;

        if (newWords.length === 0) return;

        // Ventana de búsqueda dinámica: se recalcula por cada palabra nueva
        const lookahead = 5;

        newWords.forEach(spoken => {
          if (!spoken || spoken.length < 2) return; // Ignorar palabras muy cortas/ruido

          // Recalcular maxSearch en cada iteración para evitar saltos acumulados
          const maxSearch = Math.min(currentIndex + lookahead, wordsData.length - 1);

          for (let i = currentIndex; i <= maxSearch; i++) {
            if (wordsData[i].clean === spoken) {
              advanceTo(i + 1);
              break;
            }
          }
        });
      };

      // Reinicio automático si el navegador corta la escucha por silencio
      recognition.onend = () => {
        if (isReading) {
          // Resetear estado de transcript en cada reinicio para evitar duplicados
          lastProcessedWordCount = 0;
          accumulatedFinalTranscript = '';
          recognition.start();
        }
      };

      recognition.onerror = (e) => {
        statusText.textContent = `⚠ Error de micrófono: ${e.error}`;
      };

      recognition.start();
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      const text = scriptInput.value.trim();
      if (!text) return;
      renderScript(text);
      setupDiv.style.display = 'none';
      readerDiv.style.display = 'flex';
      isReading = true;
      initSpeech();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      isReading = false;
      if (recognition) recognition.stop();
      readerDiv.style.display = 'none';
      setupDiv.style.display = 'flex';
    });
  </script>
</body>
</html>
